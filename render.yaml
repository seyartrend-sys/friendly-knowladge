services:
  - type: web
    name: nusuq-second-brain
    runtime: node
    plan: free
    region: frankfurt
    autoDeploy: true
    buildCommand: npm install --global corepack@latest && corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm db:migrate && pnpm db:seed && pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: nusuq-db
          property: connectionString
      - key: APP_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4.1-mini

databases:
  - name: nusuq-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: nusuq
    ipAllowList: []
